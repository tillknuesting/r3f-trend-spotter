name = "r3f-trend-spotter-agent"
main = "src/index.ts"
compatibility_date = "2024-01-17"

# Enable Browser Rendering
# Note: You must request access to this feature in the Cloudflare dashboard if currently in beta/restricted.
browser_rendering_services = [
  { binding = "BROWSER" }
]

# Schedule: Runs every 6 hours (matches "Daily" but gives fresher data during dev)
[triggers]
crons = ["0 */6 * * *"]

[vars]
# Environment variables that don't need to be secret
# Secrets (API keys) should be set via `wrangler secret put`

